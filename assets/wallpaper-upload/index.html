<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Backgrounds · Luma</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><img src="luma-mark.svg" alt="" /><span>luma</span></div>
      </header>
      <h1>Add backgrounds</h1>
      <p class="intro" id="intro">
        Pick as many photos as you like. Each one is cropped to fill the TV.
      </p>
      <label class="picker" id="picker">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple />
        <span class="picker-icon" aria-hidden="true">↑</span>
        <span class="picker-title">Choose photos</span>
        <span class="picker-hint">Select several at once <i>·</i> JPG, PNG or WebP</span>
      </label>
      <label class="folder" id="folder-picker" hidden>
        <input id="folder" type="file" multiple webkitdirectory />
        <span>Or choose a whole folder</span>
      </label>
      <section id="queue" hidden>
        <div class="queue-head">
          <strong id="queue-count"></strong>
          <span id="queue-room"></span>
        </div>
        <label class="collection-picker" for="collection">
          <span>Add to</span>
          <select id="collection">
            <option value="Photos">Photos</option>
          </select>
        </label>
        <p class="queue-tip">Tap a photo to adjust its crop.</p>
        <ul id="grid" class="grid"></ul>
        <div class="progress" id="progress" hidden><span id="progress-bar"></span></div>
        <div class="actions">
          <label class="button secondary" id="more">
            <input id="more-file" type="file" accept="image/jpeg,image/png,image/webp" multiple />
            Add more
          </label>
          <button id="submit" type="button">Save to TV</button>
        </div>
      </section>
      <dialog id="editor">
        <form method="dialog">
          <div class="preview">
            <canvas
              id="preview"
              width="960"
              height="540"
              aria-label="Drag to adjust the 16:9 crop."
            ></canvas>
            <span class="ratio">JPEG <i>·</i> 1920 × 1080</span>
          </div>
          <label class="zoom" for="zoom"
            ><span>Zoom</span><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"
          /></label>
          <div class="actions">
            <button id="remove" type="button" class="secondary">Remove</button>
            <button id="reset" type="button" class="secondary">Reset</button>
            <button id="done" value="done">Done</button>
          </div>
        </form>
      </dialog>
      <section id="success" class="success" aria-live="polite" hidden>
        <span class="success-mark" aria-hidden="true">✓</span>
        <h2 id="success-title">Success</h2>
        <p id="success-detail">Your backgrounds were uploaded to</p>
        <code id="success-path"></code>
        <button id="another" type="button">Add more</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <footer id="storage-footer">
        <span>Stored on this TV at</span>
        <code id="storage-path">Finding storage location…</code>
      </footer>
    </main>
  </body>
</html>
